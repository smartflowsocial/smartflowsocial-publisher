name: Secret scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid license for organization
      # repositories. The open-source binary does not.
      - name: Run gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$archive"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
