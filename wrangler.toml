name = "smartflowsocial-publisher"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]

# Worker Previews (pull-request builds) require this block. It can be empty
# when the preview uses the same top-level settings as production.
previews = { }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# KV namespace bindings. Wrangler 4 provisions this namespace on deploy.
# The id stays in the Cloudflare account, not in this file.
[[kv_namespaces]]
binding = "PROFILES"
